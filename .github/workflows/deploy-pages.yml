name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Vite `--base` controls the public path of all emitted URLs.
      # For https://<user>.github.io/War-js/ the base must be `/War-js/`.
      - name: Build
        run: npx vite build --base=/War-js/

      # Deploy the dist/ folder to the gh-pages branch.
      # In GitHub: Settings → Pages → Source → Branch: gh-pages / root
      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
