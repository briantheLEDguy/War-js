name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/web-game-conversion-7yzlN
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Vite `--base` controls the public path of all emitted URLs.
      # For https://<user>.github.io/War-js/ the base must be `/War-js/`.
      - name: Build
        run: npx vite build --base=/War-js/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
