name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write   # push to gh-pages branch
  pages: write      # Pages API deployment
  id-token: write   # OIDC for deploy-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Vite `--base` controls the public path of all emitted URLs.
      # For https://<user>.github.io/War-js/ the base must be `/War-js/`.
      - name: Build
        run: npx vite build --base=/War-js/

      # ── Strategy A: Pages API (works when source = "GitHub Actions") ──
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy via Pages API
        id: deployment
        uses: actions/deploy-pages@v4
        # Tolerate failure so the gh-pages branch push still runs when
        # Pages source is "Deploy from a branch" instead of "GitHub Actions".
        continue-on-error: true

      # ── Strategy B: push to gh-pages (works when source = "Deploy from a branch") ──
      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
