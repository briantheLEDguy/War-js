<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Regional inhabitant export review</title>
<style>body{margin:0;background:#191e25;color:#e9e4db;font:14px system-ui}main{position:fixed;inset:0}aside{position:fixed;left:16px;top:16px;padding:16px;width:285px;background:#171d25ee;border:1px solid #5c6269;border-radius:8px}h1{font-size:17px;margin:0 0 12px}label{display:block;margin:9px 0}select,input{width:100%;box-sizing:border-box}button,select{padding:6px;background:#2c3440;color:inherit;border:1px solid #727c87;border-radius:4px}small{display:block;overflow-wrap:anywhere;line-height:1.45;margin:12px 0}p{line-height:1.4;margin:10px 0}#status{color:#d2bd86}</style></head>
<body><main id="viewport"></main><aside><h1>Regional inhabitants · draft review</h1>
<label>Character<select id="asset"><option value="frontier_sunmeadow_dwarf_artisan">Dwarf workshop artisan</option></select></label>
<label>Detail<select id="lod"><option value="0">LOD 0</option><option value="1">LOD 1</option><option value="2">LOD 2</option></select></label>
<label>Clip<select id="clip"></select></label><button id="play">Pause</button>
<label>Time <span id="timeLabel">0.00 s</span><input id="time" type="range" min="0" max="2" step="0.001" value="0"></label>
<p>Drag to orbit; scroll to inspect hands, cuffs, seams and ground contact.</p><p id="status">Loading verified export…</p><small id="hash"></small>
<small>Technical checks and this viewer do not confer visual approval. No game placement or campaign state is written.</small></aside>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/examples/jsm/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/examples/jsm/controls/OrbitControls.js';
const $=id=>document.getElementById(id),scene=new THREE.Scene();scene.background=new THREE.Color('#777f89');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;$('viewport').append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.03,70),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
const studioPixels=new Float32Array(256*128*4);
for(let y=0;y<128;y++)for(let x=0;x<256;x++){const i=(y*256+x)*4,t=y/127,glow=Math.exp(-((x/256-.2)**2/.008+(t-.35)**2/.012));studioPixels[i]=.26+.3*(1-t)+glow*1.4;studioPixels[i+1]=.28+.32*(1-t)+glow*1.25;studioPixels[i+2]=.31+.38*(1-t)+glow;studioPixels[i+3]=1;}
const studio=new THREE.DataTexture(studioPixels,256,128,THREE.RGBAFormat,THREE.FloatType);studio.mapping=THREE.EquirectangularReflectionMapping;studio.needsUpdate=true;
const pmrem=new THREE.PMREMGenerator(renderer),environment=pmrem.fromEquirectangular(studio);scene.environment=environment.texture;studio.dispose();pmrem.dispose();
scene.add(new THREE.HemisphereLight(0xc5d5eb,0x695c48,1.25));const sun=new THREE.DirectionalLight(0xffeed5,3);sun.position.set(-3,6,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-3;sun.shadow.camera.right=3;sun.shadow.camera.top=3;sun.shadow.camera.bottom=-3;sun.shadow.normalBias=.002;scene.add(sun);
const floorGeometry=new THREE.BufferGeometry();floorGeometry.setAttribute('position',new THREE.Float32BufferAttribute([-20,-.002,-20,20,-.002,-20,20,-.002,20,-20,-.002,20],3));floorGeometry.setIndex([0,2,1,0,3,2]);floorGeometry.computeVertexNormals();
const floor=new THREE.Mesh(floorGeometry,new THREE.MeshStandardMaterial({color:0x777c80,roughness:.95}));floor.receiveShadow=true;scene.add(floor);
let root=null,mixer=null,clips=[],active=null,playing=true,revision=0;
function dispose(object){const textures=new Set(),materials=new Set(),geometry=new Set();object.traverse(node=>{if(node.isMesh){geometry.add(node.geometry);for(const material of Array.isArray(node.material)?node.material:[node.material])materials.add(material);}});for(const material of materials){for(const value of Object.values(material))if(value?.isTexture)textures.add(value);material.dispose();}for(const texture of textures)texture.dispose();for(const mesh of geometry)mesh.dispose();}
function selectClip(){mixer.stopAllAction();active=mixer.clipAction(clips.find(clip=>clip.name===$('clip').value));const loop=['idle','walk','run','combat_idle'].includes(active.getClip().name);active.setLoop(loop?THREE.LoopRepeat:THREE.LoopOnce,loop?Infinity:1);active.clampWhenFinished=true;active.reset().play();mixer.update(0);$('time').max=active.getClip().duration;$('time').value=0;}
async function load(){const mine=++revision;$('status').textContent='Loading verified export…';try{const key=$('asset').value,lod=Number($('lod').value),report=await fetch(`./${key}_build.json?fresh=${Date.now()}`).then(r=>{if(!r.ok)throw Error('Build report missing');return r.json();}),entry=report.lods.find(row=>row.level===lod),url=new URL(`../runtime/${entry.model}`,location.href),bytes=await fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Export missing');return r.arrayBuffer();}),hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),v=>v.toString(16).padStart(2,'0')).join('');if(hash!==entry.sha256)throw Error('Export hash differs from build report');const gltf=await new GLTFLoader().parseAsync(bytes,url.href.slice(0,url.href.lastIndexOf('/')+1));if(mine!==revision){dispose(gltf.scene);return;}if(root){mixer.stopAllAction();mixer.uncacheRoot(root);scene.remove(root);dispose(root);}root=gltf.scene;root.traverse(node=>{if(node.isMesh){node.castShadow=true;node.receiveShadow=true;}});scene.add(root);mixer=new THREE.AnimationMixer(root);clips=gltf.animations;const previous=$('clip').value;$('clip').replaceChildren(...clips.map(clip=>{const option=document.createElement('option');option.value=option.textContent=clip.name;return option;}));$('clip').value=clips.some(c=>c.name===previous)?previous:'idle';selectClip();const box=new THREE.Box3().setFromObject(root),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(size.y*.65,size.y*.13,size.y*2.25));controls.update();$('hash').textContent=`SHA-256 ${hash}`;$('status').textContent=`Verified · ${entry.triangles.toLocaleString()} triangles · ${clips.length} clips`;}catch(error){if(mine===revision)$('status').textContent=error.message;}}
$('asset').onchange=$('lod').onchange=load;$('clip').onchange=()=>mixer&&selectClip();$('play').onclick=()=>{playing=!playing;if(playing&&active){if(active.time>=active.getClip().duration)active.reset().play();active.paused=false;}$('play').textContent=playing?'Pause':'Play';};$('time').oninput=()=>{if(!active)return;playing=false;$('play').textContent='Play';active.enabled=true;active.paused=false;active.time=Number($('time').value);mixer.update(0);};
const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{const delta=Math.min(clock.getDelta(),.05);if(mixer&&playing)mixer.update(delta);if(active){$('time').value=active.time;$('timeLabel').textContent=active.time.toFixed(3)+' s';}controls.update();renderer.render(scene,camera);});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
addEventListener('pagehide',()=>{revision++;renderer.setAnimationLoop(null);controls.dispose();if(root){mixer.stopAllAction();mixer.uncacheRoot(root);dispose(root);}floorGeometry.dispose();floor.material.dispose();environment.dispose();renderer.dispose();},{once:true});load();
</script></body></html>
