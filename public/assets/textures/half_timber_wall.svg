<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512">
  <!-- Cream/white plaster background -->
  <rect width="512" height="512" fill="#e8e0cc"/>

  <!-- Slight plaster texture variation (subtle rectangles) -->
  <rect x="0"   y="0"   width="256" height="256" fill="#ebe3d0" opacity="0.4"/>
  <rect x="256" y="256" width="256" height="256" fill="#e2d8c0" opacity="0.3"/>

  <!-- ==================== Timber frame ==================== -->
  <!-- Dark brown timber color -->

  <!-- Outer frame / sill plates -->
  <!-- Top horizontal beam -->
  <rect x="0"   y="0"   width="512" height="22" fill="#2e1e0e"/>
  <!-- Bottom horizontal beam -->
  <rect x="0"   y="490" width="512" height="22" fill="#2e1e0e"/>
  <!-- Left vertical stud -->
  <rect x="0"   y="0"   width="22"  height="512" fill="#2e1e0e"/>
  <!-- Right vertical stud -->
  <rect x="490" y="0"   width="22"  height="512" fill="#2e1e0e"/>

  <!-- Mid-rail horizontal beam (half height) -->
  <rect x="0"   y="241" width="512" height="20" fill="#321f0f"/>

  <!-- Upper panel: vertical studs at 1/3 and 2/3 -->
  <rect x="167" y="0"   width="18"  height="252" fill="#2e1e0e"/>
  <rect x="326" y="0"   width="18"  height="252" fill="#2e1e0e"/>

  <!-- Lower panel: vertical studs at 1/3 and 2/3 -->
  <rect x="167" y="241" width="18"  height="271" fill="#2e1e0e"/>
  <rect x="326" y="241" width="18"  height="271" fill="#2e1e0e"/>

  <!-- Upper-left panel: diagonal brace (top-left to bottom-right) -->
  <line x1="22"  y1="22"  x2="167" y2="241" stroke="#2e1e0e" stroke-width="16" stroke-linecap="square"/>
  <!-- Upper-center panel: diagonal brace (top-right to bottom-left) -->
  <line x1="185" y1="22"  x2="326" y2="241" stroke="#2e1e0e" stroke-width="16" stroke-linecap="square"/>
  <!-- Upper-right panel: diagonal brace (top-left to bottom-right) -->
  <line x1="344" y1="22"  x2="490" y2="241" stroke="#2e1e0e" stroke-width="16" stroke-linecap="square"/>

  <!-- Lower-left panel: diagonal brace (bottom-left to top-right) -->
  <line x1="22"  y1="490" x2="167" y2="261" stroke="#2e1e0e" stroke-width="16" stroke-linecap="square"/>
  <!-- Lower-center panel: diagonal brace (bottom-right to top-left) -->
  <line x1="185" y1="490" x2="326" y2="261" stroke="#2e1e0e" stroke-width="16" stroke-linecap="square"/>
  <!-- Lower-right panel: diagonal brace (bottom-left to top-right) -->
  <line x1="344" y1="490" x2="490" y2="261" stroke="#2e1e0e" stroke-width="16" stroke-linecap="square"/>

  <!-- Shadow/depth on beam edges (lighter top, darker bottom) -->
  <rect x="0"   y="0"   width="512" height="4"  fill="#5a3a1a" opacity="0.3"/>
  <rect x="0"   y="18"  width="512" height="4"  fill="#1a0e06" opacity="0.4"/>
  <rect x="0"   y="241" width="512" height="4"  fill="#5a3a1a" opacity="0.3"/>
  <rect x="0"   y="257" width="512" height="4"  fill="#1a0e06" opacity="0.4"/>
</svg>
