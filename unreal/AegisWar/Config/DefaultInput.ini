[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

; OrbitPixels applies the game's angular sensitivity to mouse pixel deltas.
; Enhanced Input also imports the legacy axis scale; its inherited 0.07 would
; attenuate those deltas a second time. Keep pixel units and game preferences separate.
-AxisConfig=(AxisKeyName="MouseX",AxisProperties=(DeadZone=0.f,Exponent=1.f,Sensitivity=0.07f))
-AxisConfig=(AxisKeyName="MouseY",AxisProperties=(DeadZone=0.f,Exponent=1.f,Sensitivity=0.07f))
-AxisConfig=(AxisKeyName="Mouse2D",AxisProperties=(DeadZone=0.f,Exponent=1.f,Sensitivity=0.07f))
+AxisConfig=(AxisKeyName="MouseX",AxisProperties=(DeadZone=0.f,Exponent=1.f,Sensitivity=1.f,bInvert=False))
+AxisConfig=(AxisKeyName="MouseY",AxisProperties=(DeadZone=0.f,Exponent=1.f,Sensitivity=1.f,bInvert=False))
+AxisConfig=(AxisKeyName="Mouse2D",AxisProperties=(DeadZone=0.f,Exponent=1.f,Sensitivity=1.f,bInvert=False))

[/Script/Engine.PlayerInput]
; BaseInput debug commands execute before gameplay bindings. F2 also opens GM
; Tools, F1 opens Guide, and F3-F5 can be rebound. Never change view mode as a
; side effect of game input; explicit console viewmode commands remain available.
-DebugExecBindings=(Key=F1,Command="viewmode wireframe", bIgnoreShift=True)
-DebugExecBindings=(Key=F2,Command="viewmode unlit")
-DebugExecBindings=(Key=F3,Command="viewmode lit")
-DebugExecBindings=(Key=F4,Command="viewmode lit_detaillighting")
-DebugExecBindings=(Key=F5,Command="viewmode shadercomplexity")
